<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="titulo desc" font-family="Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titulo">Satélite con rueda de reacción: intercambio de momento angular, saturación y descarga</title>
  <desc id="desc">Un satélite con una rueda de reacción interna. El motor aplica un torque tau a la rueda y la rueda aplica menos tau al satélite, de modo que la rueda gira en un sentido y el satélite en el contrario. Los vectores de momento angular L de la rueda y L del satélite apuntan en sentidos opuestos y su suma es constante. Abajo, tres etapas: el giro del satélite, la saturación cuando la rueda llega a su velocidad máxima y la descarga con magnetorquers que aplican un torque externo.</desc>
  <defs>
    <marker id="fAzul" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
    <marker id="fNar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4562a"/></marker>
    <marker id="fVerde" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d5b"/></marker>
    <marker id="fGris" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <pattern id="celdas" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#2b4a7a"/><path d="M0 0H14V14" fill="none" stroke="#5f7fb0" stroke-width="1"/></pattern>
  </defs>

  <rect width="960" height="660" fill="#fbfaf6"/>

  <!-- ================= Satélite ================= -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d2a3a">Un satélite que gira sin empujarse contra nada</text>

  <!-- eje de giro -->
  <line x1="250" y1="62" x2="250" y2="398" stroke="#555" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="264" y="66" font-size="12" fill="#555">eje de giro</text>

  <!-- paneles solares -->
  <rect x="40" y="196" width="110" height="64" fill="url(#celdas)" stroke="#1d2a3a"/>
  <rect x="350" y="196" width="110" height="64" fill="url(#celdas)" stroke="#1d2a3a"/>
  <line x1="150" y1="228" x2="170" y2="228" stroke="#1d2a3a" stroke-width="3"/>
  <line x1="330" y1="228" x2="350" y2="228" stroke="#1d2a3a" stroke-width="3"/>

  <!-- cuerpo -->
  <rect x="170" y="140" width="160" height="176" rx="8" fill="#e9e6dc" stroke="#1d2a3a" stroke-width="2"/>
  <text x="178" y="158" font-size="11" fill="#4a5567">cuerpo del satélite · I<tspan baseline-shift="sub" font-size="72%">s</tspan></text>

  <!-- rueda de reacción (vista en perspectiva) -->
  <ellipse cx="250" cy="250" rx="58" ry="18" fill="#c9d6e8" stroke="#1f5fa8" stroke-width="2"/>
  <ellipse cx="250" cy="238" rx="58" ry="18" fill="#e8eef7" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="192" y1="238" x2="192" y2="250" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="308" y1="238" x2="308" y2="250" stroke="#1f5fa8" stroke-width="2"/>
  <rect x="238" y="250" width="24" height="26" fill="#8a8a8a" stroke="#333"/>
  <text x="266" y="272" font-size="11" fill="#333">motor</text>
  <text x="180" y="204" font-size="11" fill="#1f5fa8">rueda · I<tspan baseline-shift="sub" font-size="72%">r</tspan></text>

  <!-- giro de la rueda: Omega (antihorario visto desde arriba) -->
  <path d="M 214 222 A 50 14 0 0 1 300 226" fill="none" stroke="#1f5fa8" stroke-width="2.4" marker-end="url(#fAzul)"/>
  <text x="304" y="214" font-size="14" font-style="italic" fill="#1f5fa8" font-weight="700">Ω</text>

  <!-- giro del satélite: omega_s (sentido contrario) -->
  <path d="M 382 140 A 150 30 0 0 0 118 140" fill="none" stroke="#c4562a" stroke-width="2.4" marker-end="url(#fNar)"/>
  <text x="380" y="128" font-size="14" font-style="italic" fill="#c4562a" font-weight="700">ω<tspan baseline-shift="sub" font-size="72%">s</tspan></text>

  <!-- vectores de momento angular sobre el eje -->
  <line x1="250" y1="120" x2="250" y2="70" stroke="#1f5fa8" stroke-width="5" marker-end="url(#fAzul)"/>
  <text x="264" y="104" font-size="13" fill="#1f5fa8" font-weight="700">L<tspan baseline-shift="sub" font-size="72%">r</tspan> = I<tspan baseline-shift="sub" font-size="72%">r</tspan>·Ω</text>
  <line x1="250" y1="330" x2="250" y2="386" stroke="#c4562a" stroke-width="5" marker-end="url(#fNar)"/>
  <text x="264" y="364" font-size="13" fill="#c4562a" font-weight="700">L<tspan baseline-shift="sub" font-size="72%">s</tspan> = I<tspan baseline-shift="sub" font-size="72%">s</tspan>·ω<tspan baseline-shift="sub" font-size="72%">s</tspan></text>

  <!-- pares de acción y reacción -->
  <text x="40" y="312" font-size="12" fill="#1f5fa8">+τ: el motor empuja la rueda</text>
  <text x="40" y="330" font-size="12" fill="#c4562a">−τ: la rueda empuja al satélite</text>
  <text x="40" y="348" font-size="11" fill="#4a5567">(tercera ley de Newton)</text>
  <text x="264" y="392" font-size="12" fill="#1d2a3a" font-weight="700">L<tspan baseline-shift="sub" font-size="72%">r</tspan> + L<tspan baseline-shift="sub" font-size="72%">s</tspan> = constante</text>

  <!-- ================= Ecuaciones ================= -->
  <rect x="500" y="56" width="436" height="330" rx="6" fill="#f1efe8" stroke="#d9d7cf"/>
  <rect x="500" y="56" width="5" height="330" fill="#1f5fa8"/>
  <text x="518" y="82" font-size="14" font-weight="700" fill="#1d2a3a">Ecuaciones</text>
  <g font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="16" fill="#1d2a3a">
    <text x="518" y="112">Sin torque externo:</text>
    <text x="536" y="136" font-style="italic">L = I<tspan baseline-shift="sub" font-size="72%">s</tspan>·ω<tspan baseline-shift="sub" font-size="72%">s</tspan> + I<tspan baseline-shift="sub" font-size="72%">r</tspan>·Ω = constante</text>
    <text x="518" y="168">Motor sobre la rueda y reacción:</text>
    <text x="536" y="192" font-style="italic">τ = I<tspan baseline-shift="sub" font-size="72%">r</tspan>·dΩ/dt   →   −τ = I<tspan baseline-shift="sub" font-size="72%">s</tspan>·dω<tspan baseline-shift="sub" font-size="72%">s</tspan>/dt</text>
    <text x="518" y="224">Giro del satélite:</text>
    <text x="536" y="248" font-style="italic">I<tspan baseline-shift="sub" font-size="72%">s</tspan>·Δω<tspan baseline-shift="sub" font-size="72%">s</tspan> = −I<tspan baseline-shift="sub" font-size="72%">r</tspan>·ΔΩ</text>
    <text x="518" y="280">Saturación (rueda a Ω<tspan baseline-shift="sub" font-size="72%">max</tspan>):</text>
    <text x="536" y="304" font-style="italic">H<tspan baseline-shift="sub" font-size="72%">max</tspan> = I<tspan baseline-shift="sub" font-size="72%">r</tspan>·Ω<tspan baseline-shift="sub" font-size="72%">max</tspan> ;  t<tspan baseline-shift="sub" font-size="72%">sat</tspan> = H<tspan baseline-shift="sub" font-size="72%">max</tspan> / τ<tspan baseline-shift="sub" font-size="72%">d</tspan></text>
    <text x="518" y="336">Descarga con un torque externo:</text>
    <text x="536" y="360" font-style="italic">τ<tspan baseline-shift="sub" font-size="72%">mag</tspan> = μ × B   (magnetorquer)</text>
  </g>

  <!-- ================= Etapas ================= -->
  <text x="24" y="444" font-size="15" font-weight="700" fill="#1d2a3a">Tres etapas del momento angular guardado en la rueda (L<tspan baseline-shift="sub" font-size="72%">r</tspan>)</text>

  <!-- Panel 1 -->
  <g transform="translate(24,460)">
    <rect width="290" height="180" rx="6" fill="#fff" stroke="#d9d7cf"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#1d2a3a">1 · Giro o perturbación</text>
    <line x1="40" y1="130" x2="270" y2="130" stroke="#555"/>
    <line x1="40" y1="130" x2="40" y2="40" stroke="#555"/>
    <line x1="40" y1="52" x2="270" y2="52" stroke="#9b2c2c" stroke-dasharray="5 4"/>
    <text x="196" y="47" font-size="11" fill="#9b2c2c">H<tspan baseline-shift="sub" font-size="72%">max</tspan></text>
    <rect x="70" y="104" width="34" height="26" fill="#1f5fa8"/>
    <rect x="130" y="88" width="34" height="42" fill="#1f5fa8"/>
    <rect x="190" y="72" width="34" height="58" fill="#1f5fa8"/>
    <text x="26" y="94" font-size="11" fill="#555" transform="rotate(-90 26 94)">L<tspan baseline-shift="sub" font-size="72%">r</tspan></text>
    <text x="12" y="152" font-size="11" fill="#4a5567">La rueda absorbe el momento que el satélite</text>
    <text x="12" y="166" font-size="11" fill="#4a5567">no debe tener: L<tspan baseline-shift="sub" font-size="72%">r</tspan> crece.</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(334,460)">
    <rect width="290" height="180" rx="6" fill="#fff" stroke="#9b2c2c"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#9b2c2c">2 · Saturación: Ω = Ω<tspan baseline-shift="sub" font-size="72%">max</tspan></text>
    <line x1="40" y1="130" x2="270" y2="130" stroke="#555"/>
    <line x1="40" y1="130" x2="40" y2="40" stroke="#555"/>
    <line x1="40" y1="52" x2="270" y2="52" stroke="#9b2c2c" stroke-dasharray="5 4"/>
    <text x="196" y="47" font-size="11" fill="#9b2c2c">H<tspan baseline-shift="sub" font-size="72%">max</tspan></text>
    <rect x="70" y="52" width="34" height="78" fill="#9b2c2c"/>
    <rect x="130" y="52" width="34" height="78" fill="#9b2c2c"/>
    <text x="176" y="96" font-size="12" fill="#9b2c2c">ya no puede</text>
    <text x="176" y="111" font-size="12" fill="#9b2c2c">acelerar más</text>
    <text x="12" y="152" font-size="11" fill="#4a5567">Un torque perturbador τ<tspan baseline-shift="sub" font-size="72%">d</tspan> (p. ej. la presión</text>
    <text x="12" y="165" font-size="11" fill="#4a5567">solar) ya no se compensa: el satélite deriva.</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(644,460)">
    <rect width="292" height="180" rx="6" fill="#fff" stroke="#2f7d5b"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#2f7d5b">3 · Descarga del momento</text>
    <line x1="40" y1="130" x2="200" y2="130" stroke="#555"/>
    <line x1="40" y1="130" x2="40" y2="40" stroke="#555"/>
    <line x1="40" y1="52" x2="200" y2="52" stroke="#9b2c2c" stroke-dasharray="5 4"/>
    <rect x="62" y="52" width="30" height="78" fill="#9b2c2c" opacity="0.55"/>
    <rect x="112" y="92" width="30" height="38" fill="#2f7d5b"/>
    <rect x="162" y="118" width="30" height="12" fill="#2f7d5b"/>
    <!-- magnetorquer -->
    <rect x="206" y="50" width="78" height="22" rx="4" fill="#e8e3d2" stroke="#1d2a3a"/>
    <text x="245" y="65" font-size="10.5" fill="#1d2a3a" text-anchor="middle">magnetorquer</text>
    <text x="214" y="92" font-size="11.5" fill="#2f7d5b" font-style="italic">τ = μ × B</text>
    <line x1="214" y1="116" x2="272" y2="116" stroke="#2f7d5b" stroke-width="2" marker-end="url(#fVerde)"/>
    <text x="214" y="110" font-size="10.5" fill="#2f7d5b">campo B</text>
    <text x="12" y="152" font-size="11" fill="#4a5567">Un torque externo saca momento del sistema</text>
    <text x="12" y="165" font-size="11" fill="#4a5567">y la rueda puede frenar sin girar el satélite.</text>
  </g>

  <text x="936" y="654" font-size="10" fill="#8a8a8a" text-anchor="end">Esquema propio, fuera de escala.</text>
</svg>
